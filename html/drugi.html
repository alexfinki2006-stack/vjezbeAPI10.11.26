<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ime</title>
    <link rel="Stylesheet" href="stil.css">
</head>
<body>

    <h1>Obrazac za unos podataka</h1>

    <form method="" action="">
        <label>Unesite ime: </label>
        <input type="text">

        <br> <!-- break row -->

        <label>Unesite prezime: </label>
        <input type="text">

        <br>

        <label>Unesite e-mail adresu: </label>
        <input type="email">
        
        <br>

        <label>Unesite lozinku: </label>
        <input type="password" minlength="8" required>

        <br>

        <label>Unesite godinu studija: </label>
        <input type="number" min="1" max="6" required>

        <br>

        <button type="submit">Submit</button>

        <button type="reset">Reset</button>
    </form>
</body>
</html>
